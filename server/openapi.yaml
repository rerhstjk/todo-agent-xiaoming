openapi: 3.1.0
info:
  title: 小明智能体任务 API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/tasks:
    get:
      operationId: listTasks
      summary: 按创建顺序列出全部任务，包括已完成任务
      responses:
        "200":
          description: 任务列表；空列表为 []
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
    post:
      operationId: createTask
      summary: 创建一条未完成任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { $ref: "#/components/schemas/Title" }
      responses:
        "201":
          description: 新建的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/tasks/undo:
    post:
      operationId: undoDeleteTask
      summary: 撤销最近一次（或最近几次）删除
      description: 只在服务进程内保留最近 20 条删除记录，重启后清空。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 1
      responses:
        "201":
          description: 恢复出来的任务（原 id、子任务、标签等字段都会保留）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: 没有可以撤销的删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/snapshots/{id}/restore:
    post:
      operationId: restoreTaskSnapshot
      summary: 把任务清单回滚到某轮对话开始前的状态
      description: 聊天接口在每轮回复前通过 X-Task-Snapshot 响应头返回快照 id；快照只存在服务进程内存里。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 已回滚，返回回滚后的任务数量
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [restored, count]
                properties:
                  restored: { type: boolean }
                  count: { type: integer, minimum: 0 }
        "404":
          description: 快照不存在或已经过期
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/tasks/export:
    get:
      operationId: exportTasks
      summary: 导出整份任务清单
      responses:
        "200":
          description: 导出文件内容
          content:
            application/json:
              schema:
                type: object
                required: [version, exportedAt, tasks]
                properties:
                  version: { type: integer, example: 1 }
                  exportedAt: { type: string, format: date-time }
                  tasks:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
  /api/tasks/import:
    post:
      operationId: importTasks
      summary: 合并或覆盖导入任务清单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tasks]
              properties:
                mode: { type: string, enum: [merge, replace], default: merge }
                tasks:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/Task" }
      responses:
        "201":
          description: 导入结果
          content:
            application/json:
              schema:
                type: object
                required: [imported, total, mode]
                properties:
                  imported: { type: integer }
                  total: { type: integer }
                  mode: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateTask
      summary: 修改标题、完成状态、子任务或提醒
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title: { $ref: "#/components/schemas/Title" }
                done: { type: boolean }
                subtasks:
                  type: array
                  description: 整组子任务（用于前端清单面板勾选子任务），最多 50 条
                  items: { $ref: "#/components/schemas/Subtask" }
                startDate:
                  { type: string, nullable: true, description: 开始日期，YYYY-MM-DD；传 null 清空 }
                startTime:
                  { type: string, nullable: true, description: 开始时刻，HH:mm；传 null 清空 }
                priority: { type: string, nullable: true, enum: [low, normal, high] }
                effort:
                  {
                    type: number,
                    nullable: true,
                    minimum: 0,
                    maximum: 100,
                    description: 预计用时（小时）；传 null 清空,
                  }
                tags: { type: array, nullable: true, items: { type: string }, maxItems: 10 }
                note:
                  { type: string, nullable: true, maxLength: 2000, description: 备注；传 null 清空 }
                position:
                  {
                    type: integer,
                    nullable: true,
                    minimum: 0,
                    maximum: 100000,
                    description: 手动排序序号；传 null 清空,
                  }
                remind: { type: boolean, description: 打开或关闭单个任务的提醒 }
                reminderAt:
                  type: array
                  description: 自定义提醒时刻，YYYY-MM-DDTHH:mm，最多 5 个；空数组改回默认提醒
                  items: { type: string }
      responses:
        "200":
          description: 更新后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteTask
      summary: 删除一条任务
      responses:
        "204":
          description: 删除成功，响应体为空
        "404": { $ref: "#/components/responses/NotFound" }
components:
  schemas:
    Title:
      type: string
      description: 首尾空白会自动去除，去除后长度应为 1 至 200
      minLength: 1
      maxLength: 200
    Task:
      type: object
      description: 基础字段由任务 API 维护；扩展字段由聊天中的智能体写入，读取时原样返回。
      required: [id, title, done]
      properties:
        id: { type: string, format: uuid }
        title: { $ref: "#/components/schemas/Title" }
        done: { type: boolean }
        startDate: { type: string, description: 开始日期，YYYY-MM-DD }
        startTime:
          { type: string, description: 开始时刻，HH:mm（24 小时制），只有 startDate 存在时才有意义 }
        dueDate:
          {
            type: string,
            deprecated: true,
            description: 兼容旧数据的截止日期；新建任务改用 startDate,
          }
        dueTime:
          {
            type: string,
            deprecated: true,
            description: 兼容旧数据的截止时刻；新建任务改用 startTime,
          }
        priority: { type: string, enum: [low, normal, high] }
        effort: { type: number, description: 预计用时（小时），例如 0.5、2 }
        repeat:
          {
            type: string,
            enum: [daily, weekly, monthly],
            description: 重复频率；完成一次后自动生成下一次,
          }
        tags:
          type: array
          description: 标签，最多 10 个，每个不超过 20 字
          items: { type: string }
        note: { type: string, description: 备注 }
        position: { type: integer, description: 手动排序序号，数值越小越靠前 }
        remind: { type: boolean, description: 是否打开该任务的提醒（默认提醒：开始前 30 分钟） }
        reminderAt:
          type: array
          description: 自定义提醒时刻，本地时间 YYYY-MM-DDTHH:mm，最多 5 个；有自定义时只按自定义提醒
          items: { type: string }
        subtasks:
          type: array
          description: 子任务列表
          items: { $ref: "#/components/schemas/Subtask" }
    Subtask:
      type: object
      required: [id, title, done]
      properties:
        id: { type: string }
        title: { type: string }
        done: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: 请求字段无效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 任务不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
