openapi: 3.1.0
info:
  title: 小明智能体任务 API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/tasks:
    get:
      operationId: listTasks
      summary: 按创建顺序列出全部任务，包括已完成任务
      responses:
        "200":
          description: 任务列表；空列表为 []
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
    post:
      operationId: createTask
      summary: 创建一条未完成任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { $ref: "#/components/schemas/Title" }
      responses:
        "201":
          description: 新建的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/tasks/undo:
    post:
      operationId: undoDeleteTask
      summary: 撤销最近一次（或最近几次）删除
      description: 只在服务进程内保留最近 20 条删除记录，重启后清空。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 1
      responses:
        "201":
          description: 恢复出来的任务（原 id、子任务、标签等字段都会保留）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: 没有可以撤销的删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateTask
      summary: 修改标题、完成状态或子任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title: { $ref: "#/components/schemas/Title" }
                done: { type: boolean }
                subtasks:
                  type: array
                  description: 整组子任务（用于前端清单面板勾选子任务），最多 50 条
                  items: { $ref: "#/components/schemas/Subtask" }
      responses:
        "200":
          description: 更新后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteTask
      summary: 删除一条任务
      responses:
        "204":
          description: 删除成功，响应体为空
        "404": { $ref: "#/components/responses/NotFound" }
components:
  schemas:
    Title:
      type: string
      description: 首尾空白会自动去除，去除后长度应为 1 至 200
      minLength: 1
      maxLength: 200
    Task:
      type: object
      description: 基础字段由任务 API 维护；扩展字段由聊天中的智能体写入，读取时原样返回。
      required: [id, title, done]
      properties:
        id: { type: string, format: uuid }
        title: { $ref: "#/components/schemas/Title" }
        done: { type: boolean }
        startDate: { type: string, description: 开始日期，YYYY-MM-DD }
        startTime:
          { type: string, description: 开始时刻，HH:mm（24 小时制），只有 startDate 存在时才有意义 }
        dueDate: { type: string, description: 截止日期，YYYY-MM-DD }
        dueTime:
          { type: string, description: 截止时刻，HH:mm（24 小时制），只有 dueDate 存在时才有意义 }
        priority: { type: string, enum: [low, normal, high] }
        effort: { type: number, description: 预计用时（小时），例如 0.5、2 }
        repeat:
          {
            type: string,
            enum: [daily, weekly, monthly],
            description: 重复频率；完成一次后自动生成下一次,
          }
        tags:
          type: array
          description: 标签，最多 10 个，每个不超过 20 字
          items: { type: string }
        note: { type: string, description: 备注 }
        subtasks:
          type: array
          description: 子任务列表
          items: { $ref: "#/components/schemas/Subtask" }
    Subtask:
      type: object
      required: [id, title, done]
      properties:
        id: { type: string }
        title: { type: string }
        done: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: 请求字段无效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 任务不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
